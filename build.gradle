plugins {
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id "name.remal.sonarlint" version "7.0.1"
    id "com.github.jakemarsden.git-hooks" version "0.0.2"
    id 'org.liquibase.gradle' version '2.2.2'
    id "co.uzzu.dotenv.gradle" version "4.0.0"
    id "jacoco"
    id 'org.barfuin.gradle.jacocolog' version '3.1.0'
}

group = 'com.waltsoft'
version = '0.0.1'
description = 'A Spring AI-powered Agent that manages daily tasks through natural language. It leverages Function Calling to autonomously orchestrate local CRUD operations based on user intent.'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    enabled = false
}

bootRun {
    standardInput = System.in
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:1.1.2"
    }
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.shell:spring-shell-starter:3.4.0'
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'

    implementation 'org.liquibase:liquibase-core'
    implementation 'org.postgresql:postgresql'
    implementation 'io.github.cdimascio:java-dotenv:5.2.2'
    implementation 'info.picocli:picocli-spring-boot-starter:4.7.5'
    implementation 'org.jline:jline:3.30.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


test {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
        events "passed", "skipped", "failed"
        showStandardStreams = (System.getenv('DEBUG') != null)
    }

    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}

jacocoTestCoverageVerification {

    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'CLASS'
                minimum = 0.8
            }
        }

        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                minimum = 0.60
            }
        }

    }
}

sonarLint {
    ignoreFailures = false
}

tasks.named('check') {
    dependsOn 'sonarlintMain'
    dependsOn 'jacocoTestCoverageVerification'
}

gitHooks {
    hooks = ['pre-commit': 'check']
}
