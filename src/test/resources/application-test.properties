# Garante que o Liquibase rode primeiro
spring.liquibase.enabled=true
logging.level.liquibase=INFO
spring.liquibase.change-log=classpath:/db/changelog/changelog-master.xml
### Never change "spring.liquibase.contexts" property. It must always be "new,legacy".
spring.liquibase.contexts=new,legacy,test
spring.datasource.driver-class-name=org.postgresql.Driver
### Never change "spring.jpa.hibernate.ddl-auto" property. It must always be equals to "validate".
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.rabbitmq.listener.simple.auto-startup=false
spring.datasource.hikari.maximum-pool-size=3
spring.main.web-application-type=NONE
logging.level.jdbc.sqlonly=TRACE
logging.level.jdbc.resultset=OFF
logging.level.jdbc.connection=OFF
logging.level.jdbc.resultsettable=OFF
logging.level.jdbc.audit=OFF
logging.level.jdbc.sqltiming=OFF
log4j.logger.org.springframework.jdbc=DEBUG
log4j.logger.org.springframework.transaction=DEBUG
# Força o log do liquibase a aparecer mesmo em caso de erro
logging.level.org.liquibase=DEBUG
logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG